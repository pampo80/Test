site_name: Abhijit

theme:
  name: material
  features:
    - navigation.collapse
    - navigation.indexes
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
        
plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: sk
          name: Slovensky
          build: true
          nav_translations:
            Home: Úvod
            About: O projekte
            Section 1: Časť 1
            Page 1A: Stránka 1A
            Page 1B: Stránka 1B
            Page 1C: Stránka 1C
            Section 2: Časť 2
            Page 2A: Stránka 2A
            Page 2B: Stránka 2B

nav:
  - Home: index.md
  - About: about.md
  - Section 1:
      - Page 1A: section1/1a.md
      - Page 1B: section1/1b.md
      - Page 1C: section1/1c.md
  - Section 2:
      - Page 2A: section2/2a.md
      - Page 2B: section2/2b.md